<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #8EC5FC, #E0C3FC);
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-bottom: 30px;
      text-align: center;
      color: #343a40;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Analytics</h2>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 mb-4">
          <canvas id="userChart" width="400" height="200"></canvas>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <div class="card p-3">
          <h5>Total Students: <span id="studentsCount">0</span></h5>
          <h5>Total Alumni: <span id="alumniCount">0</span></h5>
        </div>
      </div>
    </div>
  </div>

  <script>
    fetch("/adminpanel/user-analytics/")
      .then(response => response.json())
      .then(data => {
        document.getElementById("studentsCount").innerText = data.students;
        document.getElementById("alumniCount").innerText = data.alumni;

        const ctx = document.getElementById("userChart").getContext("2d");

        new Chart(ctx, {
          type: 'bar', 
          data: {
            labels: ['Students', 'Alumni'],
            datasets: [{
              label: 'User Count',
              data: [data.students, data.alumni],
              backgroundColor: ['#36A2EB', '#FF6384'],
              borderRadius: 10,
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: true,
                position: 'bottom'
              }
            },
            scales: {
              y: { beginAtZero: true, precision: 0 }
            }
          }
        });
      });
  </script>
</body>
</html>
