<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delete Role</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #8EC5FC, #E0C3FC);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .delete-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 400px;
    }
    h2 {
      color: #b30000;
      margin-bottom: 20px;
    }
    p {
      color: #555;
      margin-bottom: 30px;
    }
    form {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    button, .cancel-link {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    button {
      background-color: #dc3545;
      color: white;
    }
    .cancel-link {
      background-color: #6c757d;
      color: white;
    }
    button:hover {
      background-color: #c82333;
    }
    .cancel-link:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>

<div class="delete-box">
  <h2>Delete Role</h2>
  <p>Are you sure you want to delete the role: <strong>{{ object.role_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'role-list' %}" class="cancel-link">Cancel</a>
  </form>
</div>

</body>
</html>
