<h2>Delete Batch</h2>

<p>Are you sure you want to delete this batch?</p>
<p><strong>{{ object.department.name }} ({{ object.start_year }} - {{ object.end_year }})</strong></p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'batch-list' %}">Cancel</a>
</form>
