<!DOCTYPE html>
<html>
<head>
    <title>Delete Job</title>
</head>
<body>
    <h1>Delete Job: {{ object.title }}</h1>
    <p>Are you sure you want to delete this job?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'job_list' %}">Cancel</a>
    </form>
</body>
</html>
