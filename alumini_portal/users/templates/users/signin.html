<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Alumni Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #8EC5FC, #E0C3FC);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }
    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      margin-top: 30px;
    }
    .login-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .login-button {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-bottom: 10px;
    }
    .login-button:hover {
      background-color: #0056b3;
    }
    .forgot-password {
      text-align: right;
      margin: 10px 0 20px;
    }
    .forgot-password a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .forgot-password a:hover {
      text-decoration: underline;
      color: #007bff;
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #333;
    }
    .register-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .admin-login-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #6c757d;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .admin-login-btn:hover {
      background-color: #5a6268;
      transform: translateY(-2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- Link to Admin Login -->
  <!-- <a href="{% url 'admin_login' %}" class="admin-login-btn">Admin Login</a> -->

  <div class="login-container">
    <h2>Login to Alumni Connect</h2>

    {% if messages %}
      {% for message in messages %}
        <p style="color: red;">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        {{ form.mobilenumber.label_tag }}
        {{ form.mobilenumber }}
      </div>

      <div class="form-group">
        {{ form.password.label_tag }}
        {{ form.password }}
      </div>

      <div class="forgot-password">
        <a href="{% url 'forgot-password' %}">Forgot Password?</a>
      </div>

      <div class="register-link">
        <p><a href="{% url 'send-otp' %}">Login with OTP</a></p>
      </div>


      <button class="login-button" type="submit">Login</button>
    </form>

    <!-- <div class="register-link">
      <p>Don't have an account? <a href="{% url 'signup' %}">Register here</a></p>
    </div> -->
  </div>

</body>
</html>
