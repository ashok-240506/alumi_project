{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #8EC5FC, #E0C3FC);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .form-floating > .form-control:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }

        .btn-primary {
            background-color: #6f42c1;
            border-color: #6f42c1;
        }

        .timer-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 10px;
        }

        .resend-link {
            display: none;
        }
    </style>
</head>
<body>
    <div class="otp-box">
        <h4 class="mb-4 text-center">Verify OTP</h4>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-floating mb-3">
              {{ form.otp }}
              <label for="{{ form.otp.id_for_label }}">Enter OTP</label>
              {% if form.otp.errors %}
                  <div class="text-danger small mt-1">
                      {{ form.otp.errors.0 }}
                  </div>
              {% endif %}
          </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Verify</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <div id="timer" class="timer-text">Resend OTP in 01:00</div>
            <a id="resendLink" class="resend-link" href="{% url 'send-otp' %}">Resend OTP</a>
        </div>
    </div>

    <script>
        // Set input style
        document.addEventListener('DOMContentLoaded', () => {
            const otpInput = document.querySelector('input[name="otp"]');
            if (otpInput) {
                otpInput.classList.add('form-control');
                otpInput.placeholder = 'Enter OTP';
            }
        });

        // Countdown timer
        let timerSeconds = 60;
        const timerDisplay = document.getElementById('timer');
        const resendLink = document.getElementById('resendLink');

        function updateTimer() {
            let minutes = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            let seconds = String(timerSeconds % 60).padStart(2, '0');
            timerDisplay.textContent = `Resend OTP in ${minutes}:${seconds}`;

            if (timerSeconds > 0) {
                timerSeconds--;
                setTimeout(updateTimer, 1000);
            } else {
                timerDisplay.style.display = 'none';
                resendLink.style.display = 'inline';
            }
        }

        updateTimer();
    </script>
</body>
</html>
