<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALUFA Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #8EC5FC, #E0C3FC);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 36px;
      color: #333;
    }
    header p {
      font-size: 18px;
      color: #555;
      margin-top: 8px;
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      text-align: center;
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }
    .card h3 {
      color: #7b5fc4;
      margin-bottom: 10px;
    }
    .card p {
      color: #444;
      font-size: 14px;
    }
    .nav-links {
      margin-top: 30px;
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      padding: 12px 24px;
      background: #7b5fc4;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }
    .nav-links a:hover {
      background: #5e45ab;
    }
    @media(max-width: 600px) {
      header h1 { font-size: 26px; }
      .nav-links { flex-direction: column; align-items: center; }
    }
    #userInfo {
      background-color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="nav-links">
  <a href="{% url 'student_home' %}">Your Profile</a>
  <a href="{% url 'chat_home' %}">Chat with Alumni</a>
</div>

<header>
  <h1>Welcome to ALUFA Alumni Portal</h1>
  <p>Connect, Communicate & Collaborate with your college mates</p>
  <div id="userInfo" style="margin-top: 15px; display: flex; align-items: center; gap: 15px;"></div>
</header>

<div class="card-container">
  <div class="card">
    <h3>View Alumni Data</h3>
    <p>Browse alumni information from all batches</p>
    <a href="{% url 'alumni_data' %}" style="display:inline-block;margin-top:10px;padding:8px 16px;background:#7b5fc4;color:white;border-radius:8px;text-decoration:none;">View Alumni</a>
  </div>
  <div class="card">
    <h3>Job Postings</h3>
    <p>View or share job-related opportunities here</p>
    <a href="{% url 'job_postings' %}" style="display:inline-block;margin-top:10px;padding:8px 16px;background:#7b5fc4;color:white;border-radius:8px;text-decoration:none;">Go to Jobs</a>
  </div>
</div>

<script>
  const profileData = localStorage.getItem("alufaProfile");
  if (profileData) {
    const user = JSON.parse(profileData);
    const name = user.name || "User";
    const roll = user.rollno || "";
    const imageSrc = user.photo || "https://via.placeholder.com/50";
    const userInfoDiv = document.getElementById("userInfo");
    userInfoDiv.innerHTML = `
      <img src="${imageSrc}" alt="Profile" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid #7b5fc4;" />
      <div>
        <div style="font-weight:bold;">${name} (${roll})</div>
        <button onclick="logoutUser()" style="margin-top:4px; padding:5px 10px; background:#dc3545; color:white; border:none; border-radius:6px; cursor:pointer;">Logout</button>
      </div>
    `;
  }

  function logoutUser() {
    localStorage.removeItem("alufaProfile");
    alert("You have been logged out.");
    window.location.href = "{% url 'student_login' %}";
  }
</script>

</body>
</html>
