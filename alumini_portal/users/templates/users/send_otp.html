<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send OTP</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }

        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 12px 12px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: transparent;
        }

        .form-group label {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 16px;
            color: #777;
            pointer-events: none;
            transition: 0.2s ease all;
            background: white;
            padding: 0 4px;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: #3f51b5;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #3f51b5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #303f9f;
        }

        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #ccc;
            }

            .alert-success {
            color: green;
            background-color: #eafaf1;
            border-color: #b2f2bb;
            }

            .alert-error {
            color: #c0392b;
            background-color: #fdecea;
            border-color: #f5c6cb;
            }

            .alert-info {
            color: #0c5460;
            background-color: #d1ecf1;
            border-color: #bee5eb;
            }

        .field-error {
            font-size: 13px;
            color: #d32f2f;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Send OTP</h2>

      {% if messages %}
        <div id="flash-messages" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
          {% for message in messages %}
              <div class="alert alert-{{ message.tags }}" role="alert">
                  {{ message }}
              </div>
            {% endfor %}
        </div>
      {% endif %}


    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <input
                type="text"
                name="mobile_number"
                id="mobile_number"
                placeholder=" "
                value="{{ form.mobile_number.value|default:'' }}"
                required
            />
            <label for="mobile_number">Mobile or Email</label>
            {% if form.mobile_number.errors %}
                <div class="field-error">{{ form.mobile_number.errors.0 }}</div>
            {% endif %}
        </div>

        <button type="submit" class="btn">Send OTP</button>
    </form>
</div>
<script>
  setTimeout(() => {
    const flash = document.getElementById('flash-messages');
    if (flash) {
      flash.style.opacity = '0';
      setTimeout(() => flash.remove(), 500); 
    }
  }, 3000); // Hide after 5 seconds
</script>
</body>
</html>
